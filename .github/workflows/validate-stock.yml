name: Validate historical stock analytics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/validate-stock.yml'
      - 'analytics_v2/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r analytics_v2/requirements.txt
      - name: Download original historical dataset
        run: |
          curl --fail --location --retry 2 'https://www.kaggle.com/api/v1/datasets/download/leomauro/brazilian-stock-market-data-warehouse' -o /tmp/market.zip
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          required=['dimCoin','dimTime','dimCompany','factCoins','factStocks']
          out=Path('/tmp/market-csv');out.mkdir()
          with ZipFile('/tmp/market.zip') as z:
              for table in required:
                  matches=[name for name in z.namelist() if Path(name).name.lower()==table.lower()+'.csv']
                  assert len(matches)==1,(table,matches,z.namelist()[:25])
                  with z.open(matches[0]) as src,(out/(table+'.csv')).open('wb') as dst:
                      shutil.copyfileobj(src,dst)
          PY
      - name: Load warehouse and calculate analytics
        run: |
          python analytics_v2/load.py /tmp/market-csv /tmp/warehouse.sqlite
          python analytics_v2/market_kpis.py /tmp/warehouse.sqlite --output analytics_v2/output
      - name: Validate outputs and reconcile volume
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          d=Path('analytics_v2/output')
          q=json.loads((d/'quality.json').read_text())
          assert q['foreign_key_violations']==0
          assert q['unmatched_stock_rows']==0
          assert q['accepted_rows']>0
          m=pd.read_csv(d/'stock_monthly.csv')
          y=pd.read_csv(d/'stock_yearly.csv')
          s=pd.read_csv(d/'sectors.csv')
          assert m.observations.sum()==y.observations.sum()==q['accepted_rows']
          assert m.volume.sum()==y.volume.sum()==s.volume.sum()
          assert not m.duplicated(['keyCompany','month']).any()
          assert not y.duplicated(['keyCompany','year']).any()
          print(json.dumps(q,indent=2))
          print((d/'findings.md').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-stock-aggregate-results
          path: |
            analytics_v2/output/quality.json
            analytics_v2/output/findings.md
            analytics_v2/output/dashboard.png
            analytics_v2/output/sectors.csv
          if-no-files-found: error
